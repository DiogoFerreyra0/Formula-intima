<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administración | Fórmula Íntima</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-fondo: #FFF8ED;
            --color-tarjeta: #FFFFFF;
            --color-secundario-caja: #F4E4D9;
            --color-primario: #6D1D26;
            --color-oscuro: #40171F;
            --color-acento: #B9825B;
            --color-borde: #E5D5C5;
            --color-texto: #333333;
            --color-texto-suave: #666666;
            --color-error: #B02A37;
            --color-exito: #28A745;
            --fuente-titulos: 'Cormorant Garamond', serif;
            --fuente-texto: 'Nunito Sans', sans-serif;
        }

        body {
            background-color: var(--color-fondo);
            font-family: var(--fuente-texto);
            color: var(--color-texto);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .acceso {
            width: 100%;
            max-width: 440px;
            background-color: var(--color-tarjeta);
            border: 1px solid var(--color-borde);
            border-radius: 8px;
            padding: 2.5rem 2rem;
            box-shadow: 0 15px 35px rgba(109, 29, 38, 0.08);
        }

        .acceso__cabecera {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .acceso__marca {
            font-family: var(--fuente-titulos);
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--color-primario);
            line-height: 1.1;
            margin-bottom: 0.3rem;
        }

        .acceso__subtitulo {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-texto-suave);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .aviso-demo {
            background-color: var(--color-secundario-caja);
            border-left: 3px solid var(--color-primario);
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            color: var(--color-oscuro);
            border-radius: 4px;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .formulario-acceso {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .formulario-acceso__grupo {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .formulario-acceso__etiqueta {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--color-oscuro);
        }

        .formulario-acceso__input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--color-borde);
            border-radius: 4px;
            font-size: 0.95rem;
            color: var(--color-texto);
            background-color: #FAFAFA;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .formulario-acceso__input:focus {
            border-color: var(--color-primario);
            background-color: #FFFFFF;
        }

        .formulario-acceso__boton {
            margin-top: 0.5rem;
            padding: 0.95rem;
            background-color: var(--color-oscuro);
            color: var(--color-fondo);
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .formulario-acceso__boton:hover {
            background-color: var(--color-primario);
        }

        .alerta {
            display: none;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            font-weight: 600;
        }

        .alerta--error {
            background-color: #F8D7DA;
            color: var(--color-error);
            border: 1px solid #F5C6CB;
        }

        .alerta--exito {
            background-color: #D4EDDA;
            color: var(--color-exito);
            border: 1px solid #C3E6CB;
        }

        .acceso__pie {
            margin-top: 1.8rem;
            text-align: center;
            padding-top: 1.25rem;
            border-top: 1px solid var(--color-secundario-caja);
        }

        .acceso__enlace-retorno {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-acento);
            text-decoration: none;
        }

        .acceso__enlace-retorno:hover {
            color: var(--color-primario);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main class="acceso">
        <header class="acceso__cabecera">
            <h1 class="acceso__marca">Fórmula Íntima</h1>
            <p class="acceso__subtitulo">Panel de Gestión de Productos</p>
        </header>

        <div class="aviso-demo" id="cartel-modo-prueba">
            <strong>Modo Prueba Local Activo:</strong><br>
            Usuario: <code>duena@formulaintima.com</code><br>
            Contraseña: <code>123456</code>
        </div>

        <div id="mensaje-alerta" class="alerta" role="alert"></div>

        <form id="formulario-login" class="formulario-acceso">
            <div class="formulario-acceso__grupo">
                <label for="campo-email" class="formulario-acceso__etiqueta">Correo electrónico</label>
                <input type="email" id="campo-email" class="formulario-acceso__input" value="duena@formulaintima.com" required>
            </div>

            <div class="formulario-acceso__grupo">
                <label for="campo-clave" class="formulario-acceso__etiqueta">Contraseña</label>
                <input type="password" id="campo-clave" class="formulario-acceso__input" value="123456" required>
            </div>

            <button type="submit" id="boton-ingresar" class="formulario-acceso__boton">
                Ingresar al panel
            </button>
        </form>

        <footer class="acceso__pie">
            <a href="index.html" class="acceso__enlace-retorno">&larr; Volver a la tienda online</a>
        </footer>
    </main>

    <script>
        // CONFIGURACIÓN SUPABASE (Sin choque de nombres)
        const SUPABASE_URL = "https://TU_PROYECTO.supabase.co";
        const SUPABASE_ANON_KEY = "TU_CLAVE_ANON_PUBLICA";

        const clienteSupabase = (typeof window.supabase !== 'undefined' && SUPABASE_URL !== "https://TU_PROYECTO.supabase.co")
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
            : null;

        const formulario = document.getElementById('formulario-login');
        const campoEmail = document.getElementById('campo-email');
        const campoClave = document.getElementById('campo-clave');
        const botonIngresar = document.getElementById('boton-ingresar');
        const mensajeAlerta = document.getElementById('mensaje-alerta');

        function mostrarAlerta(texto, tipo = 'error') {
            mensajeAlerta.textContent = texto;
            mensajeAlerta.className = `alerta alerta--${tipo}`;
            mensajeAlerta.style.display = 'block';
        }

        // Si ya inició sesión antes, redirige directo a admin.html
        async function comprobarSesion() {
            if (clienteSupabase) {
                document.getElementById('cartel-modo-prueba').style.display = 'none';
                const { data: { session } } = await clienteSupabase.auth.getSession();
                if (session) window.location.href = 'admin.html';
            } else {
                const sesionLocal = localStorage.getItem('fi_admin_sesion');
                if (sesionLocal) window.location.href = 'admin.html';
            }
        }
        comprobarSesion();

        formulario.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = campoEmail.value.trim();
            const password = campoClave.value;

            botonIngresar.disabled = true;
            botonIngresar.textContent = "Verificando...";

            // 1. Si Supabase está configurado, usa Supabase real
            if (clienteSupabase) {
                try {
                    const { error } = await clienteSupabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        mostrarAlerta("Correo o contraseña incorrectos.", "error");
                        botonIngresar.disabled = false;
                        botonIngresar.textContent = "Ingresar al panel";
                        return;
                    }
                    mostrarAlerta("¡Acceso correcto! Redirigiendo...", "exito");
                    setTimeout(() => { window.location.href = 'admin.html'; }, 600);
                } catch (err) {
                    mostrarAlerta("Error de conexión.", "error");
                    botonIngresar.disabled = false;
                    botonIngresar.textContent = "Ingresar al panel";
                }
            } 
            // 2. Modo Prueba Local (Sin necesidad de XAMPP ni servidor)
            else {
                if (password === "123456" || password.length >= 4) {
                    localStorage.setItem('fi_admin_sesion', JSON.stringify({ email: email }));
                    mostrarAlerta("¡Acceso concedido! Abriendo panel...", "exito");
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 500);
                } else {
                    mostrarAlerta("Contraseña incorrecta. Usa: 123456", "error");
                    botonIngresar.disabled = false;
                    botonIngresar.textContent = "Ingresar al panel";
                }
            }
        });
    </script>
</body>
</html>
