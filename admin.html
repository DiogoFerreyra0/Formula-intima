<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Fórmula Íntima</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-fondo: #FFF8ED;
            --color-fondo-caja: #F4E4D9;
            --color-tarjeta: #FFFFFF;
            --color-primario: #6D1D26;
            --color-oscuro: #40171F;
            --color-acento: #B9825B;
            --color-borde: #E5D5C5;
            --color-texto: #333333;
            --color-texto-suave: #666666;
            --color-peligro: #B02A37;
            --color-exito: #28A745;
            --fuente-titulos: 'Cormorant Garamond', serif;
            --fuente-texto: 'Nunito Sans', sans-serif;
        }

        body {
            background-color: var(--color-fondo);
            font-family: var(--fuente-texto);
            color: var(--color-texto);
            line-height: 1.5;
            min-height: 100vh;
        }

        .barra-admin {
            background-color: var(--color-oscuro);
            color: var(--color-fondo);
            padding: 1rem 1.5rem;
            border-bottom: 2px solid var(--color-primario);
        }

        .barra-admin__contenedor {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .barra-admin__marca {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
        }

        .barra-admin__logo {
            font-family: var(--fuente-titulos);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-fondo);
            text-decoration: none;
        }

        .barra-admin__badge {
            background-color: var(--color-primario);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .barra-admin__usuario {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 0.9rem;
        }

        .barra-admin__enlace-tienda {
            color: var(--color-fondo);
            text-decoration: none;
            font-weight: 600;
        }

        .barra-admin__enlace-tienda:hover {
            color: var(--color-acento);
        }

        .barra-admin__boton-salir {
            background-color: transparent;
            color: var(--color-fondo);
            border: 1px solid var(--color-fondo);
            padding: 0.4rem 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .barra-admin__boton-salir:hover {
            background-color: var(--color-peligro);
            border-color: var(--color-peligro);
        }

        .admin-principal {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .admin-encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--color-borde);
        }

        .admin-encabezado__titulo {
            font-family: var(--fuente-titulos);
            font-size: 2.2rem;
            color: var(--color-primario);
        }

        .admin-encabezado__acciones {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .boton-primario {
            background-color: var(--color-primario);
            color: var(--color-fondo);
            border: none;
            padding: 0.75rem 1.4rem;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .boton-primario:hover {
            background-color: var(--color-oscuro);
        }

        .input-busqueda {
            padding: 0.7rem 1rem;
            border: 1px solid var(--color-borde);
            border-radius: 4px;
            background-color: var(--color-tarjeta);
            font-size: 0.9rem;
            outline: none;
            width: 260px;
        }

        .toast {
            display: none;
            padding: 1rem 1.5rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .toast--exito {
            background-color: #D4EDDA;
            color: var(--color-exito);
            border: 1px solid #C3E6CB;
        }

        .toast--error {
            background-color: #F8D7DA;
            color: var(--color-peligro);
            border: 1px solid #F5C6CB;
        }

        .tabla-contenedor {
            background-color: var(--color-tarjeta);
            border: 1px solid var(--color-borde);
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(109, 29, 38, 0.04);
        }

        .tabla-productos {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .tabla-productos th {
            background-color: var(--color-fondo-caja);
            color: var(--color-oscuro);
            font-weight: 700;
            padding: 1rem;
            border-bottom: 1px solid var(--color-borde);
        }

        .tabla-productos td {
            padding: 1rem;
            border-bottom: 1px solid var(--color-borde);
            vertical-align: middle;
        }

        .miniatura-foto {
            width: 55px;
            height: 55px;
            object-fit: contain;
            background-color: var(--color-fondo-caja);
            border: 1px solid var(--color-borde);
            border-radius: 4px;
        }

        .badge-tabla {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            background-color: var(--color-fondo-caja);
            color: var(--color-oscuro);
            margin-top: 3px;
        }

        .acciones-fila {
            display: flex;
            gap: 0.5rem;
        }

        .boton-accion {
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            border: 1px solid var(--color-borde);
            background-color: var(--color-tarjeta);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .boton-accion--editar:hover {
            background-color: var(--color-fondo-caja);
            border-color: var(--color-primario);
            color: var(--color-primario);
        }

        .boton-accion--borrar:hover {
            background-color: var(--color-peligro);
            border-color: var(--color-peligro);
            color: #FFFFFF;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(64, 23, 31, 0.6);
            backdrop-filter: blur(3px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal__caja {
            background-color: var(--color-tarjeta);
            border: 1px solid var(--color-borde);
            border-radius: 8px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .modal__cabecera {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--color-borde);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--color-fondo-caja);
        }

        .modal__titulo {
            font-family: var(--fuente-titulos);
            font-size: 1.6rem;
            color: var(--color-primario);
        }

        .modal__cerrar {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .formulario-producto {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .formulario-fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .campo-grupo label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--color-oscuro);
        }

        .campo-grupo input, .campo-grupo select {
            padding: 0.7rem;
            border: 1px solid var(--color-borde);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .campo-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .vista-previa-contenedor {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .vista-previa-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border: 1px solid var(--color-borde);
            border-radius: 4px;
            background-color: var(--color-fondo-caja);
            display: none;
        }

        .modal__pie {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--color-borde);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            background-color: #FAFAFA;
        }

        .boton-secundario {
            background-color: transparent;
            border: 1px solid var(--color-borde);
            padding: 0.75rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header class="barra-admin">
        <div class="barra-admin__contenedor">
            <div class="barra-admin__marca">
                <a href="admin.html" class="barra-admin__logo">Fórmula Íntima</a>
                <span class="barra-admin__badge">Administración</span>
            </div>
            <div class="barra-admin__usuario">
                <span id="usuario-email">Cargando...</span>
                <a href="index.html" class="barra-admin__enlace-tienda">&nearr; Ir a la tienda online</a>
                <button id="boton-cerrar-sesion" class="barra-admin__boton-salir">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main class="admin-principal">
        <div class="admin-encabezado">
            <div>
                <h1 class="admin-encabezado__titulo">Gestión de Catálogo</h1>
                <p style="color: var(--color-texto-suave); font-size: 0.9rem;">Creá, modificá o eliminá los productos que se muestran en la tienda.</p>
            </div>
            <div class="admin-encabezado__acciones">
                <input type="text" id="filtro-busqueda" class="input-busqueda" placeholder="Buscar por título o marca...">
                <button id="boton-nuevo-producto" class="boton-primario">+ Nuevo Producto</button>
            </div>
        </div>

        <div id="toast-mensaje" class="toast"></div>

        <div class="tabla-contenedor">
            <table class="tabla-productos">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Título</th>
                        <th>Marca</th>
                        <th>Categoría</th>
                        <th>Precio Oferta</th>
                        <th>Transferencia</th>
                        <th>Etiquetas</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-productos"></tbody>
            </table>
        </div>
    </main>

    <!-- MODAL CREAR / EDITAR -->
    <div id="modal-producto" class="modal">
        <div class="modal__caja">
            <div class="modal__cabecera">
                <h2 id="modal-titulo" class="modal__titulo">Nuevo Producto</h2>
                <button type="button" id="modal-boton-cerrar" class="modal__cerrar">&times;</button>
            </div>

            <form id="formulario-producto" class="formulario-producto">
                <input type="hidden" id="producto-id">

                <div class="campo-grupo">
                    <label for="campo-titulo">Título del producto *</label>
                    <input type="text" id="campo-titulo" required placeholder="Ej: Gel Lubricante Sexitive Dante al Infierno 500ml">
                </div>

                <div class="formulario-fila">
                    <div class="campo-grupo">
                        <label for="campo-marca">Marca *</label>
                        <select id="campo-marca" required>
                            <option value="Sexitive">Sexitive</option>
                            <option value="Pretty Love">Pretty Love</option>
                            <option value="Satisfyer">Satisfyer</option>
                            <option value="Lovense">Lovense</option>
                            <option value="Svakom">Svakom</option>
                            <option value="Fórmula Íntima">Fórmula Íntima</option>
                        </select>
                    </div>
                    <div class="campo-grupo">
                        <label for="campo-categoria">Categoría *</label>
                        <select id="campo-categoria" required>
                            <option value="cosmetica">Cosmética y geles</option>
                            <option value="sextoys">Sex Toys</option>
                            <option value="lenceria">Lencería</option>
                            <option value="fetiche">Fetiche / Bondage</option>
                            <option value="bienestar">Bienestar / ESI</option>
                        </select>
                    </div>
                </div>

                <div class="formulario-fila">
                    <div class="campo-grupo">
                        <label for="campo-color">Color</label>
                        <select id="campo-color">
                            <option value="negro">Negro</option>
                            <option value="rojo">Rojo</option>
                            <option value="rosa">Rosa</option>
                            <option value="piel">Piel</option>
                        </select>
                    </div>
                    <div class="campo-grupo">
                        <label for="campo-modelo">Modelo</label>
                        <select id="campo-modelo">
                            <option value="liso">Liso</option>
                            <option value="ondas">Ondas</option>
                            <option value="delfin">Delfín</option>
                        </select>
                    </div>
                </div>

                <div class="formulario-fila">
                    <div class="campo-grupo">
                        <label for="campo-precio-tachado">Precio original tachado ($)</label>
                        <input type="number" id="campo-precio-tachado" placeholder="Ej: 34999">
                    </div>
                    <div class="campo-grupo">
                        <label for="campo-precio-oferta">Precio final de venta ($) *</label>
                        <input type="number" id="campo-precio-oferta" required placeholder="Ej: 27999">
                    </div>
                </div>

                <div class="formulario-fila">
                    <div class="campo-grupo">
                        <label for="campo-precio-transferencia">Precio por transferencia ($)</label>
                        <input type="number" id="campo-precio-transferencia" placeholder="Ej: 25199">
                    </div>
                    <div class="campo-grupo">
                        <label for="campo-cuotas">Texto de cuotas</label>
                        <input type="text" id="campo-cuotas" placeholder="Ej: 3 cuotas sin interés de $9.333">
                    </div>
                </div>

                <div class="formulario-fila">
                    <div class="campo-grupo">
                        <label for="campo-badge-descuento">Badge de descuento</label>
                        <input type="text" id="campo-badge-descuento" placeholder="Ej: 20% OFF">
                    </div>
                    <div class="campo-grupo" style="justify-content: flex-end;">
                        <label class="campo-checkbox">
                            <input type="checkbox" id="campo-envio-gratis" checked>
                            <span>Ofrece Envío Gratis</span>
                        </label>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label for="campo-foto-archivo">Subir Foto desde tu computadora</label>
                    <input type="file" id="campo-foto-archivo" accept="image/*">
                    <label for="campo-foto-url" style="margin-top:0.4rem; font-size:0.8rem; color:#666;">O pegar enlace de imagen (URL):</label>
                    <input type="url" id="campo-foto-url" placeholder="https://...">

                    <div class="vista-previa-contenedor">
                        <img id="img-vista-previa" class="vista-previa-img" alt="Vista previa">
                        <span id="texto-vista-previa" style="font-size: 0.8rem; color: #666;">Sin foto seleccionada</span>
                    </div>
                </div>

                <div class="modal__pie">
                    <button type="button" id="modal-boton-cancelar" class="boton-secundario">Cancelar</button>
                    <button type="submit" id="boton-guardar-producto" class="boton-primario">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://TU_PROYECTO.supabase.co";
        const SUPABASE_ANON_KEY = "TU_CLAVE_ANON_PUBLICA";

        const clienteSupabase = (typeof window.supabase !== 'undefined' && SUPABASE_URL !== "https://TU_PROYECTO.supabase.co")
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
            : null;

        const CATALOGO_POR_DEFECTO = [
            {
                id: "1",
                titulo: "Gel Lubricante Sexitive Dante al Infierno 500ml",
                marca: "Sexitive",
                categoria: "cosmetica",
                color: "rojo",
                modelo: "liso",
                precio_tachado: 34999,
                precio_oferta: 27999,
                precio_transferencia: 25199,
                cuotas: "3 cuotas sin interés de $9.333",
                badge_descuento: "20% OFF",
                envio_gratis: true,
                imagen_url: "https://placehold.co/400x400/F4E4D9/6D1D26?text=Dante+al+Infierno"
            },
            {
                id: "2",
                titulo: "Spray Retardante Sexitive Héroe Extra Time 20ml",
                marca: "Sexitive",
                categoria: "cosmetica",
                color: "negro",
                modelo: "liso",
                precio_tachado: 29500,
                precio_oferta: 23600,
                precio_transferencia: 21240,
                cuotas: "3 cuotas sin interés de $7.866",
                badge_descuento: "20% OFF",
                envio_gratis: true,
                imagen_url: "https://placehold.co/400x400/F4E4D9/6D1D26?text=Heroe+Spray"
            },
            {
                id: "4",
                titulo: "Succionador de Clítoris — 10 funciones de pulso",
                marca: "Satisfyer",
                categoria: "sextoys",
                color: "rosa",
                modelo: "ondas",
                precio_tachado: 89900,
                precio_oferta: 71920,
                precio_transferencia: 64728,
                cuotas: "3 cuotas sin interés de $23.973",
                badge_descuento: "20% OFF",
                envio_gratis: true,
                imagen_url: "https://placehold.co/400x400/F4E4D9/6D1D26?text=Succionador+Satisfyer"
            },
            {
                id: "5",
                titulo: "Body de Encaje Línea Inclusiva Real",
                marca: "Fórmula Íntima",
                categoria: "lenceria",
                color: "negro",
                modelo: "liso",
                precio_tachado: 62000,
                precio_oferta: 52700,
                precio_transferencia: 47430,
                cuotas: "3 cuotas sin interés de $17.566",
                badge_descuento: "15% OFF",
                envio_gratis: true,
                imagen_url: "https://placehold.co/400x400/F4E4D9/6D1D26?text=Body+Encaje+Inclusivo"
            }
        ];

        let productosLocales = [];
        let imagenBase64Temporal = "";

        const usuarioEmailSpan = document.getElementById('usuario-email');
        const cuerpoTabla = document.getElementById('cuerpo-tabla-productos');
        const toastMensaje = document.getElementById('toast-mensaje');
        const modal = document.getElementById('modal-producto');
        const formProducto = document.getElementById('formulario-producto');

        // 1. Verificar sesión
        async function verificarAcceso() {
            if (clienteSupabase) {
                const { data: { session } } = await clienteSupabase.auth.getSession();
                if (!session) { window.location.href = 'login.html'; return; }
                usuarioEmailSpan.textContent = session.user.email;
            } else {
                const sesionLocal = JSON.parse(localStorage.getItem('fi_admin_sesion'));
                if (!sesionLocal) { window.location.href = 'login.html'; return; }
                usuarioEmailSpan.textContent = sesionLocal.email + " (Modo Local)";
            }
            cargarProductos();
        }
        verificarAcceso();

        document.getElementById('boton-cerrar-sesion').addEventListener('click', async () => {
            if (clienteSupabase) await clienteSupabase.auth.signOut();
            localStorage.removeItem('fi_admin_sesion');
            window.location.href = 'login.html';
        });

        // 2. Cargar productos
        async function cargarProductos() {
            if (clienteSupabase) {
                const { data } = await clienteSupabase.from('productos').select('*').order('created_at', { ascending: false });
                productosLocales = data || [];
            } else {
                const guardados = localStorage.getItem('fi_catalogo_admin');
                if (guardados) {
                    productosLocales = JSON.parse(guardados);
                } else {
                    productosLocales = [...CATALOGO_POR_DEFECTO];
                    localStorage.setItem('fi_catalogo_admin', JSON.stringify(productosLocales));
                }
            }
            renderizarTabla(productosLocales);
        }

        function renderizarTabla(lista) {
            if (lista.length === 0) {
                cuerpoTabla.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:2.5rem;">No hay productos cargados. ¡Creá el primero!</td></tr>`;
                return;
            }

            cuerpoTabla.innerHTML = lista.map(p => `
                <tr>
                    <td><img src="${p.imagen_url || 'https://placehold.co/60x60/F4E4D9/6D1D26?text=Foto'}" class="miniatura-foto"></td>
                    <td><strong>${p.titulo}</strong></td>
                    <td>${p.marca}</td>
                    <td><span class="badge-tabla">${p.categoria}</span></td>
                    <td><strong>$${Number(p.precio_oferta).toLocaleString('es-AR')}</strong></td>
                    <td>${p.precio_transferencia ? `$${Number(p.precio_transferencia).toLocaleString('es-AR')}` : '-'}</td>
                    <td>
                        ${p.badge_descuento ? `<span class="badge-tabla">${p.badge_descuento}</span>` : ''}
                        ${p.envio_gratis ? `<span class="badge-tabla" style="background:#D4EDDA;color:#155724;">Envío gratis</span>` : ''}
                    </td>
                    <td>
                        <div class="acciones-fila">
                            <button type="button" class="boton-accion boton-accion--editar" onclick="window.abrirModalEditar('${p.id}')">✏️ Editar</button>
                            <button type="button" class="boton-accion boton-accion--borrar" onclick="window.borrarProducto('${p.id}')">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Buscador interno del admin
        document.getElementById('filtro-busqueda').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            const filtrados = productosLocales.filter(p => p.titulo.toLowerCase().includes(q) || p.marca.toLowerCase().includes(q));
            renderizarTabla(filtrados);
        });

        // 3. Subida de foto desde la PC (convierte a Base64 para funcionar sin servidor)
        document.getElementById('campo-foto-archivo').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                imagenBase64Temporal = evt.target.result;
                const img = document.getElementById('img-vista-previa');
                img.src = imagenBase64Temporal;
                img.style.display = 'block';
                document.getElementById('texto-vista-previa').textContent = file.name;
            };
            reader.readAsDataURL(file);
        });

        // 4. Abrir y cerrar Modal
        document.getElementById('boton-nuevo-producto').addEventListener('click', () => {
            formProducto.reset();
            document.getElementById('producto-id').value = '';
            imagenBase64Temporal = '';
            document.getElementById('img-vista-previa').style.display = 'none';
            document.getElementById('modal-titulo').textContent = 'Nuevo Producto';
            modal.style.display = 'flex';
        });

        function cerrarModal() { modal.style.display = 'none'; }
        document.getElementById('modal-boton-cerrar').addEventListener('click', cerrarModal);
        document.getElementById('modal-boton-cancelar').addEventListener('click', cerrarModal);

        window.abrirModalEditar = function(id) {
            const prod = productosLocales.find(p => String(p.id) === String(id));
            if (!prod) return;

            document.getElementById('producto-id').value = prod.id;
            document.getElementById('campo-titulo').value = prod.titulo;
            document.getElementById('campo-marca').value = prod.marca || 'Sexitive';
            document.getElementById('campo-categoria').value = prod.categoria || 'cosmetica';
            document.getElementById('campo-color').value = prod.color || 'negro';
            document.getElementById('campo-modelo').value = prod.modelo || 'liso';
            document.getElementById('campo-precio-tachado').value = prod.precio_tachado || '';
            document.getElementById('campo-precio-oferta').value = prod.precio_oferta;
            document.getElementById('campo-precio-transferencia').value = prod.precio_transferencia || '';
            document.getElementById('campo-cuotas').value = prod.cuotas || '';
            document.getElementById('campo-badge-descuento').value = prod.badge_descuento || '';
            document.getElementById('campo-envio-gratis').checked = !!prod.envio_gratis;
            document.getElementById('campo-foto-url').value = (prod.imagen_url && !prod.imagen_url.startsWith('data:')) ? prod.imagen_url : '';
            imagenBase64Temporal = prod.imagen_url || '';

            const img = document.getElementById('img-vista-previa');
            if (prod.imagen_url) {
                img.src = prod.imagen_url;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }

            document.getElementById('modal-titulo').textContent = 'Modificar Producto';
            modal.style.display = 'flex';
        };

        // 5. Guardar Producto
        formProducto.addEventListener('submit', async (e) => {
            e.preventDefault();
            const idExistente = document.getElementById('producto-id').value;
            const urlEscrita = document.getElementById('campo-foto-url').value.trim();
            const imagenFinal = imagenBase64Temporal || urlEscrita || 'https://placehold.co/400x400/F4E4D9/6D1D26?text=Nuevo+Producto';

            const nuevoProd = {
                id: idExistente || String(Date.now()),
                titulo: document.getElementById('campo-titulo').value.trim(),
                marca: document.getElementById('campo-marca').value,
                categoria: document.getElementById('campo-categoria').value,
                color: document.getElementById('campo-color').value,
                modelo: document.getElementById('campo-modelo').value,
                precio_tachado: document.getElementById('campo-precio-tachado').value ? parseFloat(document.getElementById('campo-precio-tachado').value) : null,
                precio_oferta: parseFloat(document.getElementById('campo-precio-oferta').value),
                precio_transferencia: document.getElementById('campo-precio-transferencia').value ? parseFloat(document.getElementById('campo-precio-transferencia').value) : null,
                cuotas: document.getElementById('campo-cuotas').value.trim() || null,
                badge_descuento: document.getElementById('campo-badge-descuento').value.trim() || null,
                envio_gratis: document.getElementById('campo-envio-gratis').checked,
                imagen_url: imagenFinal
            };

            if (idExistente) {
                const idx = productosLocales.findIndex(p => String(p.id) === String(idExistente));
                if (idx !== -1) productosLocales[idx] = nuevoProd;
                mostrarNotificacion("¡Producto actualizado! Ya se ve reflejado en la tienda.");
            } else {
                productosLocales.unshift(nuevoProd);
                mostrarNotificacion("¡Producto creado con éxito! Ya aparece en la tienda.");
            }

            localStorage.setItem('fi_catalogo_admin', JSON.stringify(productosLocales));
            cerrarModal();
            renderizarTabla(productosLocales);
        });

        // 6. Borrar Producto
        window.borrarProducto = function(id) {
            const prod = productosLocales.find(p => String(p.id) === String(id));
            if (!prod) return;
            if (!confirm(`¿Estás segura de borrar "${prod.titulo}"?`)) return;

            productosLocales = productosLocales.filter(p => String(p.id) !== String(id));
            localStorage.setItem('fi_catalogo_admin', JSON.stringify(productosLocales));
            renderizarTabla(productosLocales);
            mostrarNotificacion("Producto eliminado.");
        };

        function mostrarNotificacion(texto) {
            toastMensaje.textContent = texto;
            toastMensaje.className = "toast toast--exito";
            toastMensaje.style.display = "block";
            setTimeout(() => { toastMensaje.style.display = "none"; }, 3500);
        }
    </script>
</body>
</html>
